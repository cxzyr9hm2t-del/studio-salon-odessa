<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Studio Salon Odessa - A sanctuary of style featuring the latest hair color trends in a luxurious, boutique setting.">
  <meta name="keywords" content="hair salon, Odessa, Ontario, purple hair, balayage, vivid color, Loyalist Township">

  <meta property="og:description" content="Experience bespoke hair artistry in an intimate, boutique setting.">
  <title>Studio Salon Odessa | Where Art Meets Beauty</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💜</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap');
    
    :root {
      /* Purple Hair Color Palette - RGB Accurate */
      --electric-amethyst: #9966CC;
      --violet: #8F00FF;
      --lavender: #D6CADD;
      --true-purple: #6A0DAD;
      --plasma-lavender: #6600CA;
      --neon-violet: #B23BEE;
      --deep-plum: #3D1A5C;
      --iris: #5A4FCF;
      --orchid: #DA70D6;
      --mauve: #E0B0FF;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0a0612; overflow-x: hidden; }
    
    .font-display { font-family: 'Playfair Display', serif; }
    .font-body { font-family: 'Inter', sans-serif; }
    
    /* Aurora Background Animation */
    @keyframes aurora {
      0%, 100% { 
        background-position: 0% 50%;
        filter: hue-rotate(0deg);
      }
      25% { background-position: 50% 100%; }
      50% { 
        background-position: 100% 50%;
        filter: hue-rotate(15deg);
      }
      75% { background-position: 50% 0%; }
    }
    
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(3deg); } }
    @keyframes pulse-glow { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 0.8; transform: scale(1.05); } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    @keyframes ripple { 0% { transform: scale(1); opacity: 0.4; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes prism { 0%, 100% { filter: hue-rotate(0deg); } 50% { filter: hue-rotate(30deg); } }
    @keyframes liquid-flow { 0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; } 50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; } }
    @keyframes specular { 0%, 100% { opacity: 0.3; transform: translateX(-100%) rotate(45deg); } 50% { opacity: 0.6; transform: translateX(100%) rotate(45deg); } }
    @keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 20px rgba(138, 43, 226, 0.4), 0 0 40px rgba(138, 43, 226, 0.2); } 50% { box-shadow: 0 0 30px rgba(138, 43, 226, 0.6), 0 0 60px rgba(138, 43, 226, 0.3), 0 0 80px rgba(138, 43, 226, 0.1); } }
    @keyframes text-glow { 0%, 100% { text-shadow: 0 0 20px rgba(178, 59, 238, 0.5); } 50% { text-shadow: 0 0 40px rgba(178, 59, 238, 0.8), 0 0 60px rgba(138, 43, 226, 0.4); } }
    @keyframes border-flow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-pulse-glow { animation: pulse-glow 4s ease-in-out infinite; }
    .animate-shimmer { background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent); background-size: 200% 100%; animation: shimmer 3s infinite; }
    .animate-prism { animation: prism 8s ease-in-out infinite; }
    .animate-liquid { animation: liquid-flow 8s ease-in-out infinite; }
    .animate-glow-pulse { animation: glow-pulse 3s ease-in-out infinite; }
    .animate-text-glow { animation: text-glow 3s ease-in-out infinite; }
    
    /* Liquid Glass Effect */
    .liquid-glass {
      position: relative;
      background: linear-gradient(135deg, rgba(138, 43, 226, 0.15) 0%, rgba(75, 0, 130, 0.1) 50%, rgba(148, 0, 211, 0.15) 100%);
      backdrop-filter: blur(20px) saturate(180%) brightness(1.1);
      -webkit-backdrop-filter: blur(20px) saturate(180%) brightness(1.1);
      border: 1px solid rgba(178, 59, 238, 0.2);
      border-radius: 24px;
      overflow: hidden;
    }
    
    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%, rgba(255,255,255,0.05) 100%);
      pointer-events: none;
    }
    
    .liquid-glass::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.1) 45%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 55%, transparent 60%);
      animation: specular 6s ease-in-out infinite;
      pointer-events: none;
    }
    
    /* Enhanced Liquid Glass with Refraction */
    .liquid-glass-pro {
      position: relative;
      background: linear-gradient(145deg, rgba(106, 13, 173, 0.2) 0%, rgba(90, 79, 207, 0.15) 50%, rgba(138, 43, 226, 0.2) 100%);
      backdrop-filter: blur(24px) saturate(200%) brightness(1.05) contrast(1.1);
      -webkit-backdrop-filter: blur(24px) saturate(200%) brightness(1.05) contrast(1.1);
      border: 1px solid;
      border-image: linear-gradient(135deg, rgba(178, 59, 238, 0.4), rgba(218, 112, 214, 0.2), rgba(178, 59, 238, 0.4)) 1;
      border-radius: 28px;
      box-shadow: 
        0 8px 32px rgba(138, 43, 226, 0.15),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    .liquid-glass-pro::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
      pointer-events: none;
      border-radius: 28px 28px 0 0;
    }
    
    /* Gradient Border Animation */
    .gradient-border {
      position: relative;
      background: linear-gradient(135deg, rgba(10, 6, 18, 0.9), rgba(20, 10, 35, 0.9));
      border-radius: 24px;
    }
    
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, #8F00FF, #B23BEE, #DA70D6, #6A0DAD, #8F00FF);
      background-size: 300% 300%;
      animation: border-flow 4s ease infinite;
      border-radius: 26px;
      z-index: -1;
    }
    
    /* Glass Input */
    .glass-input {
      background: rgba(138, 43, 226, 0.1);
      border: 1px solid rgba(178, 59, 238, 0.3);
      backdrop-filter: blur(10px);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .glass-input:focus {
      background: rgba(138, 43, 226, 0.2);
      border-color: rgba(178, 59, 238, 0.6);
      outline: none;
      box-shadow: 0 0 30px rgba(138, 43, 226, 0.3), 0 0 60px rgba(178, 59, 238, 0.1);
    }
    
    /* Gradient Text */
    .gradient-text-purple {
      background: linear-gradient(135deg, #E0B0FF 0%, #B23BEE 25%, #8F00FF 50%, #6A0DAD 75%, #B23BEE 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 4s linear infinite;
    }
    
    /* Neon Text */
    .neon-text {
      color: #E0B0FF;
      text-shadow: 
        0 0 7px #B23BEE,
        0 0 10px #B23BEE,
        0 0 21px #B23BEE,
        0 0 42px #8F00FF,
        0 0 82px #8F00FF;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(10, 6, 18, 0.5); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #8F00FF, #6A0DAD); border-radius: 4px; }
    
    /* Select styling */
    select option { background: #1a0a2e; color: #E0B0FF; }
    
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <!-- SVG Filters for Liquid Glass Effect -->
  <svg style="position: absolute; width: 0; height: 0;">
    <defs>
      <filter id="liquid-distortion" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.01" numOctaves="2" seed="5" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <filter id="glow">
        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <linearGradient id="purple-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#8F00FF"/>
        <stop offset="50%" style="stop-color:#B23BEE"/>
        <stop offset="100%" style="stop-color:#6A0DAD"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Aurora Orb Component

    // Service Card with Liquid Glass

    // Testimonial Card
    const TestimonialCard = ({ name, text, service, rating, image }) => (
      <LiquidGlassCard hover={false} className="p-8 h-full flex flex-col">
        <div className="relative z-10 flex flex-col h-full">
          <div className="flex gap-1 mb-4">
            {[...Array(5)].map((_, i) => (
              <svg key={i} className={`w-5 h-5 ${i < rating ? 'text-violet-400' : 'text-white/20'}`} fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
              </svg>
            ))}
          </div>
          <p className="text-violet-100/80 font-light leading-relaxed flex-grow italic">"{text}"</p>
          <div className="mt-6 pt-6 border-t border-violet-400/20 flex items-center gap-4">

    // Instagram Card
    const InstagramCard = ({ image, likes, caption }) => (

          <div className="flex items-center gap-2 mb-2">
            <svg className="w-4 h-4 text-fuchsia-400" fill="currentColor" viewBox="0 0 20 20">
              <path fillRule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clipRule="evenodd" />

    // Pricing Card
    const PricingCard = ({ tier, services, featured = false }) => (

    // Navigation Link
    const NavLink = ({ children, href, onClick }) => (

        {children}
        <span className="absolute -bottom-1 left-0 w-0 h-0.5 bg-gradient-to-r from-violet-500 to-fuchsia-500 group-hover:w-full transition-all duration-300 rounded-full" />
      </a>
    );

    // Animated Counter
    const AnimatedCounter = ({ end, suffix = '', label }) => {
      const [count, setCount] = useState(0);
      const ref = useRef(null);
      const [isVisible, setIsVisible] = useState(false);

      useEffect(() => {
        const observer = new IntersectionObserver(([entry]) => {
          if (entry.isIntersecting) setIsVisible(true);
        }, { threshold: 0.5 });
        if (ref.current) observer.observe(ref.current);
        return () => observer.disconnect();
      }, []);

      useEffect(() => {
        if (!isVisible) return;
        let start = 0;
        const duration = 2000;
        const increment = end / (duration / 16);
        const timer = setInterval(() => {
          start += increment;
          if (start >= end) { setCount(end); clearInterval(timer); }
          else { setCount(Math.floor(start)); }
        }, 16);
        return () => clearInterval(timer);
      }, [isVisible, end]);

      return (
        <div ref={ref} className="text-center">
          <p className="font-display text-5xl md:text-6xl gradient-text-purple mb-2">{count}{suffix}</p>
          <p className="text-violet-300/50 text-xs uppercase tracking-widest">{label}</p>
        </div>
      );
    };

    // Main App
    function App() {
      const [isScrolled, setIsScrolled] = useState(false);
      const [bookingOpen, setBookingOpen] = useState(false);
      const [formData, setFormData] = useState({ name: '', email: '', phone: '', service: '', date: '', time: '', message: '' });
      const [formStatus, setFormStatus] = useState('');
      const [menuOpen, setMenuOpen] = useState(false);
      const [particles, setParticles] = useState([]);
      const [activeTestimonial, setActiveTestimonial] = useState(0);
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

      useEffect(() => {
        const newParticles = Array.from({ length: 60 }, (_, i) => ({
          id: i, left: Math.random() * 100, top: Math.random() * 100,
          size: Math.random() * 4 + 1,
          duration: 10 + Math.random() * 20, delay: Math.random() * 10,
          color: ['#8F00FF', '#B23BEE', '#DA70D6', '#6A0DAD', '#E0B0FF'][Math.floor(Math.random() * 5)]
        }));
        setParticles(newParticles);
      }, []);

      useEffect(() => {
        const handleScroll = () => setIsScrolled(window.scrollY > 50);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => {
        const timer = setInterval(() => setActiveTestimonial((prev) => (prev + 1) % testimonials.length), 5000);
        return () => clearInterval(timer);
      }, []);

      useEffect(() => {
        const handleMouseMove = (e) => {
          setMousePos({ x: e.clientX / window.innerWidth, y: e.clientY / window.innerHeight });
        };
        window.addEventListener('mousemove', handleMouseMove);
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, []);

      const handleInputChange = (e) => setFormData({ ...formData, [e.target.name]: e.target.value });

      const handleSubmit = (e) => {
        e.preventDefault();

          `       💜 NEW BOOKING REQUEST 💜\n` +
          `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n` +

          `APPOINTMENT DETAILS\n──────────────────────────────\n` +

          `ADDITIONAL NOTES\n──────────────────────────────\n${formData.message || 'No additional notes.'}\n\n` +
          `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\nSent via Studio Salon Website\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`
        );
        window.location.href = `mailto:jordanch14@gmail.com?subject=${subject}&body=${body}`;
        setFormStatus('success');
        setTimeout(() => { setBookingOpen(false); setFormStatus(''); setFormData({ name: '', email: '', phone: '', service: '', date: '', time: '', message: '' }); }, 2000);
      };

      const scrollToSection = (sectionId) => {
        setMenuOpen(false);
        document.getElementById(sectionId)?.scrollIntoView({ behavior: 'smooth' });
      };

      const openBookingWithService = (serviceName) => {
        setFormData({ ...formData, service: serviceName });
        setBookingOpen(true);
      };

      const services = [
        { icon: '✂️', title: 'Signature Cut', description: 'Precision cutting tailored to your unique features and lifestyle', price: '$65+', duration: '45 min' },
        { icon: '🎨', title: 'Vivid Color', description: 'Bold, vibrant fashion colors including purple, violet & amethyst tones', price: '$150+', duration: '2.5 hrs' },
        { icon: '💜', title: 'Balayage', description: 'Hand-painted highlights for natural, dimensional color', price: '$180+', duration: '3 hrs' },
        { icon: '✨', title: 'Color Correction', description: 'Expert transformation for previously colored hair', price: '$120/hr', duration: 'Varies' },
        { icon: '🌿', title: 'Keratin Treatment', description: 'Smoothing therapy for frizz-free, manageable hair', price: '$250+', duration: '2.5 hrs' },
        { icon: '💆', title: 'Head Spa Ritual', description: 'Luxurious scalp treatment with aromatherapy massage', price: '$85', duration: '60 min' },
      ];

      const testimonials = [
        { name: 'Sarah M.', text: 'The purple balayage is absolutely stunning! The color is so vibrant and the blend is perfect. The studio atmosphere is pure luxury.', service: 'Vivid Color', rating: 5, image: '👩🏼' },

                    <div><p className="text-violet-400/50 text-xs uppercase tracking-widest mb-2">Contact</p><a href="mailto:jordanch14@gmail.com" className="text-white/90 hover:text-violet-300 transition-colors">jordanch14@gmail.com</a><p className="text-violet-200/50 text-sm">(613) 555-0123</p></div>
                  </div>
                </div>
              </LiquidGlassCard>
            </div>
          </section>

          {/* Footer */}
          <footer className="relative py-12 px-6 border-t border-violet-500/10">
            <div className="max-w-7xl mx-auto">
              <div className="flex flex-col md:flex-row justify-between items-center gap-8">
                <div className="font-display text-xl font-medium tracking-wider"><span className="gradient-text-purple">STUDIO</span></div>
                <div className="flex gap-4">
                  {[
                    { href: 'https://instagram.com/studiosalonodessa', icon: <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/> },
                    { href: 'https://facebook.com/studiosalonodessa', icon: <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/> },
                    { href: 'https://tiktok.com/@studiosalonodessa', icon: <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/> }
                  ].map((s, i) => (
                    <a key={i} href={s.href} target="_blank" rel="noopener noreferrer" className="w-11 h-11 liquid-glass rounded-full flex items-center justify-center text-violet-300/70 hover:text-white transition-all duration-300">
                      <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">{s.icon}</svg>
                    </a>
                  ))}
                </div>
                <p className="text-violet-300/30 text-xs">© 2026 Studio Salon Odessa. All rights reserved.</p>
              </div>
            </div>
          </footer>

          {/* Booking Modal */}
          {bookingOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#0a0612]/90 backdrop-blur-xl" onClick={(e) => e.target === e.currentTarget && setBookingOpen(false)}>
              <LiquidGlassCard hover={false} variant="pro" className="w-full max-w-lg max-h-[90vh] overflow-y-auto scrollbar-hide">
                <div className="p-8 relative z-10">
                  <div className="flex justify-between items-start mb-8">
                    <div>
                      <p className="text-violet-400/70 text-xs uppercase tracking-[0.3em] mb-2">Quick Booking</p>
                      <h3 className="font-display text-3xl font-medium gradient-text-purple">Reserve Your Seat</h3>
                    </div>
                    <button onClick={() => setBookingOpen(false)} className="text-violet-300/50 hover:text-white transition-colors p-2">
                      <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M6 18L18 6M6 6l12 12" /></svg>
                    </button>
                  </div>
                  {formStatus === 'success' ? (
                    <div className="text-center py-12">
                      <div className="w-20 h-20 mx-auto mb-6 rounded-full bg-gradient-to-br from-violet-500/30 to-fuchsia-500/30 flex items-center justify-center animate-glow-pulse">
                        <svg className="w-10 h-10 text-violet-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
                      </div>
                      <h4 className="font-display text-2xl gradient-text-purple mb-2">Opening Email Client...</h4>
                      <p className="text-violet-200/60 text-sm">Your booking request is being prepared</p>
                    </div>
                  ) : (
                    <form onSubmit={handleSubmit} className="space-y-5">
                      <div className="grid grid-cols-2 gap-4">
                        <div><label className="block text-violet-300/60 text-xs uppercase tracking-widest mb-2">Name *</label><input type="text" name="name" value={formData.name} onChange={handleInputChange} required className="w-full px-4 py-3 rounded-xl glass-input text-white text-sm" placeholder="Your name" /></div>
                        <div><label className="block text-violet-300/60 text-xs uppercase tracking-widest mb-2">Phone *</label><input type="tel" name="phone" value={formData.phone} onChange={handleInputChange} required className="w-full px-4 py-3 rounded-xl glass-input text-white text-sm" placeholder="(613) 555-0123" /></div>
                      </div>
                      <div><label className="block text-violet-300/60 text-xs uppercase tracking-widest mb-2">Email *</label><input type="email" name="email" value={formData.email} onChange={handleInputChange} required className="w-full px-4 py-3 rounded-xl glass-input text-white text-sm" placeholder="you@email.com" /></div>
                      <div>
                        <label className="block text-violet-300/60 text-xs uppercase tracking-widest mb-2">Service *</label>
                        <select name="service" value={formData.service} onChange={handleInputChange} required className="w-full px-4 py-3 rounded-xl glass-input text-white text-sm appearance-none cursor-pointer">
                          <option value="">Select a service</option>
                          <optgroup label="Cuts & Styling"><option value="Women's Cut & Style - $65+">Women's Cut & Style - $65+</option><option value="Men's Cut - $35+">Men's Cut - $35+</option><option value="Blowout / Styling - $45+">Blowout / Styling - $45+</option></optgroup>
                          <optgroup label="Color Services"><option value="Vivid / Fashion Color - $150+">Vivid / Fashion Color - $150+</option><option value="Partial Highlights - $120+">Partial Highlights - $120+</option><option value="Full Highlights - $165+">Full Highlights - $165+</option><option value="Balayage - $180+">Balayage - $180+</option><option value="Color Correction - $120/hr">Color Correction - $120/hr</option></optgroup>
                          <optgroup label="Treatments"><option value="Keratin Treatment - $250+">Keratin Treatment - $250+</option><option value="Head Spa Ritual - $85">Head Spa Ritual - $85</option><option value="Deep Conditioning - $35">Deep Conditioning - $35</option></optgroup>
                          <optgroup label="Special"><option value="Bridal Styling - $300+">Bridal Styling - $300+</option><option value="Consultation (Complimentary)">Consultation (Complimentary)</option></optgroup>
                        </select>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div><label className="block text-violet-300/60 text-xs uppercase tracking-widest mb-2">Preferred Date</label><input type="date" name="date" value={formData.date} onChange={handleInputChange} className="w-full px-4 py-3 rounded-xl glass-input text-white text-sm" /></div>
                        <div>
                          <label className="block text-violet-300/60 text-xs uppercase tracking-widest mb-2">Preferred Time</label>
                          <select name="time" value={formData.time} onChange={handleInputChange} className="w-full px-4 py-3 rounded-xl glass-input text-white text-sm appearance-none cursor-pointer">
                            <option value="">Select time</option>
                            {['9:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '1:00 PM', '2:00 PM', '3:00 PM', '4:00 PM', '5:00 PM', '6:00 PM'].map(t => <option key={t} value={t}>{t}</option>)}
                          </select>
                        </div>
                      </div>
                      <div><label className="block text-violet-300/60 text-xs uppercase tracking-widest mb-2">Additional Notes</label><textarea name="message" value={formData.message} onChange={handleInputChange} rows={3} className="w-full px-4 py-3 rounded-xl glass-input text-white text-sm resize-none" placeholder="Tell us about your hair goals..." /></div>
                      <button type="submit" className="w-full py-4 bg-gradient-to-r from-violet-600 to-fuchsia-600 rounded-xl text-white text-sm uppercase tracking-widest hover:from-violet-500 hover:to-fuchsia-500 transition-all duration-300 hover:shadow-[0_10px_40px_rgba(138,43,226,0.4)] font-medium">
                        Send Booking Request
                      </button>
                      <p className="text-violet-300/40 text-xs text-center">Booking requests sent to jordanch14@gmail.com • We'll confirm within 24 hours</p>
                    </form>
                  )}
                </div>
              </LiquidGlassCard>
            </div>
          )}

          {/* Floating Book Button (Mobile) */}
          <div className="fixed bottom-6 right-6 z-40 lg:hidden">
            <button onClick={() => setBookingOpen(true)} className="w-16 h-16 rounded-full bg-gradient-to-r from-violet-600 to-fuchsia-600 flex items-center justify-center shadow-[0_10px_40px_rgba(138,43,226,0.5)] animate-glow-pulse">
              <svg className="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
            </button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
